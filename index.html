<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
  <title>涵涵根鲲鲲的空间 · 下注平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #2a2f3f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
      position: relative;
    }

    /* 装饰性浮动光晕 */
    body::before {
      content: "";
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 180, 200, 0.25), transparent 60%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -15%;
      right: -5%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 80% 70%, rgba(160, 200, 255, 0.3), transparent 65%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 550px;
      background: rgba(20, 22, 31, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 48px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      transition: all 0.3s ease;
    }

    /* 标题与介绍区域 */
    .header-section {
      text-align: center;
      color: #f0e7ff;
    }

    .space-title {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #f9d8e6, #c6b4ff, #a4d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 8px 12px rgba(180, 150, 255, 0.4));
      margin-bottom: 10px;
      line-height: 1.2;
      text-shadow: 0 0 15px rgba(200, 180, 255, 0.5);
    }

    .intro-text {
      font-size: 1.25rem;
      font-weight: 400;
      color: #d1c9f0;
      background: rgba(255, 255, 255, 0.08);
      display: inline-block;
      padding: 10px 28px;
      border-radius: 60px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      letter-spacing: 1px;
    }

    .intro-text i {
      font-style: normal;
      margin: 0 4px;
    }

    /* 平台卡片 */
    .platform-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 40px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .bet-category {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .category-label {
      font-size: 1.3rem;
      font-weight: 600;
      color: #eae2ff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
      padding-left: 6px;
      border-left: 4px solid #ffb6d9;
      margin-bottom: 4px;
    }

    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    /* 选项按钮样式 */
    .option-btn {
      flex: 1 1 calc(33.333% - 14px);
      min-width: 90px;
      background: rgba(30, 32, 44, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 14px 8px;
      font-size: 1rem;
      font-weight: 600;
      color: #d6d0f0;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, rgba(45, 40, 60, 0.7), rgba(30, 28, 42, 0.8));
    }

    .option-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 200, 230, 0.7);
      box-shadow: 0 12px 22px rgba(180, 140, 255, 0.3);
      color: #fff;
      background: rgba(55, 48, 75, 0.8);
    }

    .option-btn.selected {
      background: linear-gradient(135deg, #b38bff, #7b5cb0);
      border-color: #f3c6ff;
      color: white;
      box-shadow: 0 0 20px #b77eff;
      font-weight: 700;
      transform: scale(1.02);
      border-width: 2px;
    }

    /* 颜色选项定制小圆点 */
    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px currentColor;
    }

    .submit-area {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    .bet-button {
      background: linear-gradient(135deg, #ff99cc, #c684ff);
      border: none;
      padding: 18px 42px;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 3px;
      box-shadow: 0 15px 30px rgba(200, 100, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.4);
      backdrop-filter: blur(5px);
    }

    .bet-button:hover {
      background: linear-gradient(135deg, #ffb3d9, #b38bff);
      box-shadow: 0 20px 35px rgba(220, 120, 255, 0.7);
      transform: scale(1.02);
      letter-spacing: 4px;
    }

    .bet-button:active {
      transform: scale(0.97);
    }

    .result-message {
      text-align: center;
      margin-top: 6px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #f5e1ff;
      background: rgba(0,0,0,0.3);
      padding: 12px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.6px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    @media (max-width: 450px) {
      .options-grid {
        gap: 10px;
      }
      .option-btn {
        padding: 12px 4px;
        font-size: 0.9rem;
        min-width: 70px;
      }
      .space-title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 头部：涵涵根鲲鲲的空间 -->
    <div class="header-section">
      <h1 class="space-title">✨涵涵根鲲鲲✨</h1>
      <div class="intro-text">
        <i>🌸</i> 神秘下注 · 随心而选 <i>🐾</i>
      </div>
    </div>

    <!-- 下注平台卡片 -->
    <div class="platform-card">
      <!-- 第一项：男女 -->
      <div class="bet-category">
        <div class="category-label">
          <span>⚡ 性别选择</span>
        </div>
        <div class="options-grid" id="gender-group">
          <button class="option-btn" data-category="gender" data-value="男">👦 男</button>
          <button class="option-btn" data-category="gender" data-value="女">👧 女</button>
        </div>
      </div>

      <!-- 第二项：两边颜色选择 -->
      <div class="bet-category">
        <div class="category-label">
          <span>🎨 两边颜色</span>
        </div>
        <div class="options-grid" id="color-group">
          <button class="option-btn" data-category="color" data-value="红">
            <span class="color-dot" style="background: #ff4d6d; color: #ff4d6d;"></span> 红
          </button>
          <button class="option-btn" data-category="color" data-value="蓝">
            <span class="color-dot" style="background: #4d7cff; color: #4d7cff;"></span> 蓝
          </button>
          <button class="option-btn" data-category="color" data-value="绿">
            <span class="color-dot" style="background: #4cd97b; color: #4cd97b;"></span> 绿
          </button>
        </div>
      </div>

      <!-- 第三项：性格选择 -->
      <div class="bet-category">
        <div class="category-label">
          <span>🌀 性格特质</span>
        </div>
        <div class="options-grid" id="personality-group">
          <button class="option-btn" data-category="personality" data-value="开朗">☀️ 开朗</button>
          <button class="option-btn" data-category="personality" data-value="内敛">🌙 内敛</button>
          <button class="option-btn" data-category="personality" data-value="勇敢">⚔️ 勇敢</button>
          <button class="option-btn" data-category="personality" data-value="温柔">🌸 温柔</button>
        </div>
      </div>

      <!-- 提交下注按钮 -->
      <div class="submit-area">
        <button class="bet-button" id="place-bet-btn">🔮 下 注 🔮</button>
      </div>
      
      <!-- 显示下注结果 -->
      <div class="result-message" id="result-display">
        💫 等待你的选择...
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 当前选中的值
      const selection = {
        gender: null,
        color: null,
        personality: null
      };

      // 获取所有选项按钮
      const optionButtons = document.querySelectorAll('.option-btn');
      const resultDisplay = document.getElementById('result-display');
      const betButton = document.getElementById('place-bet-btn');

      // 更新按钮选中样式 (根据类别)
      function updateSelectedClass(category, value) {
        // 先移除该类别下所有按钮的selected类
        const group = document.getElementById(`${category}-group`);
        if (!group) return;
        const buttons = group.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
          btn.classList.remove('selected');
        });
        // 如果有选中的值，为对应按钮添加selected类
        if (value) {
          buttons.forEach(btn => {
            if (btn.dataset.value === value) {
              btn.classList.add('selected');
            }
          });
        }
      }

      // 处理选项点击
      function handleOptionClick(event) {
        const btn = event.currentTarget;
        const category = btn.dataset.category;
        const value = btn.dataset.value;

        if (!category || !value) return;

        // 如果点击的是已选中的项，则取消选中（toggle效果）
        if (selection[category] === value) {
          // 取消选中
          selection[category] = null;
          updateSelectedClass(category, null);
          // 清空结果显示中的部分提示（但保留通用消息）
          resultDisplay.textContent = '🔄 已取消选择，重新挑选吧';
          return;
        }

        // 否则设置新的选中值
        selection[category] = value;
        updateSelectedClass(category, value);
        
        // 简单反馈
        resultDisplay.textContent = `✨ 已选择 ${getCategoryChinese(category)}：${value}`;
      }

      // 获取类别中文名
      function getCategoryChinese(category) {
        const map = {
          'gender': '性别',
          'color': '颜色',
          'personality': '性格'
        };
        return map[category] || category;
      }

      // 为所有选项按钮绑定事件
      optionButtons.forEach(btn => {
        btn.addEventListener('click', handleOptionClick);
      });

      // 检查是否所有类别都已选择
      function isAllSelected() {
        return selection.gender && selection.color && selection.personality;
      }

      // 下注按钮点击逻辑
      betButton.addEventListener('click', function() {
        if (!isAllSelected()) {
          // 提示缺少哪些选择
          const missing = [];
          if (!selection.gender) missing.push('性别');
          if (!selection.color) missing.push('两边颜色');
          if (!selection.personality) missing.push('性格');
          
          resultDisplay.innerHTML = `⚠️ 请先选择：<strong>${missing.join('、')}</strong> 后再下注哦~`;
          resultDisplay.style.color = '#ffb7b7';
          // 短暂恢复颜色动画
          setTimeout(() => {
            resultDisplay.style.color = '#f5e1ff';
          }, 2000);
          return;
        }

        // 所有选项已选：生成下注结果模拟
        const genderEmoji = selection.gender === '男' ? '👦' : '👧';
        const colorMap = {
          '红': '❤️',
          '蓝': '💙',
          '绿': '💚'
        };
        const colorEmoji = colorMap[selection.color] || '🎨';
        const personalityEmojiMap = {
          '开朗': '☀️',
          '内敛': '🌙',
          '勇敢': '⚔️',
          '温柔': '🌸'
        };
        const persEmoji = personalityEmojiMap[selection.personality] || '🌀';

        // 随机生成一个趣味结果（模拟下注开奖感觉）
        const randomOutcomes = [
          "🎉 恭喜！鲲鲲为你送上一朵云彩～",
          "🍀 幸运之星降临！涵涵对你微笑。",
          "✨ 神秘力量觉醒了！双倍快乐！",
          "🌸 温柔的风吹过，鲲鲲绕着你转圈。",
          "🌟 你选择的组合隐藏着宇宙秘密！",
          "💫 涵涵说：今天你是最特别的！",
          "🦋 蝴蝶效应启动，好运即将到来。"
        ];
        const randomMessage = randomOutcomes[Math.floor(Math.random() * randomOutcomes.length)];

        // 构建完整下注信息
        const betDetails = `${genderEmoji} ${selection.gender} · ${colorEmoji} ${selection.color}色 · ${persEmoji} ${selection.personality}`;
        
        resultDisplay.innerHTML = `🎲 下注成功！<br> ${betDetails} <br> <span style="font-size:1rem;">${randomMessage}</span>`;
        resultDisplay.style.color = '#f5e1ff';
        
        // 可以添加小小的震动动画效果（视觉）
        betButton.style.transform = 'scale(0.96)';
        setTimeout(() => {
          betButton.style.transform = '';
        }, 150);
      });

      // 可选：初始化一些默认提示 (但保留空白状态，让用户主动选择)
      // 设置一个温和的引导
      resultDisplay.textContent = '💫 点击上方选项，定制你的能量组合';

      // 额外：如果用户想重置某个选择，已在点击中实现toggle，不需额外重置按钮。
      // 但为了方便，可以双击选项取消（已在toggle中支持）
    })();
  </script>
</body>
</html>
