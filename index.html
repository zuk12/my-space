<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
  <title>涵涵根坤坤的空间 · 双人下注平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 动态粒子背景 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(100, 200, 255, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(200, 100, 255, 0.1) 0%, transparent 50%);
    }

    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 40px 40px, 40px 40px; }
    }

    .scan-line {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 150%;
      background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 255, 0.03) 50%, transparent 100%);
      z-index: 1;
      pointer-events: none;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      0% { top: -150%; }
      100% { top: 100%; }
    }

    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 登录卡片 */
    .login-container {
      background: rgba(10, 14, 28, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 36px;
      padding: 35px 25px;
      box-shadow: 0 0 40px rgba(0, 180, 255, 0.3), inset 0 0 20px rgba(0, 255, 200, 0.2);
      color: #fff;
    }

    .login-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #c084fc, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 25px #7c3aed;
      margin-bottom: 30px;
    }

    .login-dual {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .login-box {
      flex: 1 1 220px;
      background: rgba(20, 25, 45, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 28px;
      padding: 20px 15px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      transition: 0.25s;
    }

    .login-box.hh-box {
      border-color: rgba(192, 132, 252, 0.7);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
    }

    .login-box.kk-box {
      border-color: rgba(59, 130, 246, 0.7);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
    }

    .login-avatar {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }

    .login-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .hh-box .login-name {
      color: #c084fc;
      text-shadow: 0 0 15px #a855f7;
    }

    .kk-box .login-name {
      color: #60a5fa;
      text-shadow: 0 0 15px #3b82f6;
    }

    .password-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: 0.3s;
      letter-spacing: 2px;
    }

    .password-input:focus {
      border-color: #0ff;
      box-shadow: 0 0 18px #0ff;
    }

    .login-btn {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 4px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.6);
      transition: all 0.3s;
    }

    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 35px rgba(37, 99, 235, 0.8);
    }

    .error-msg {
      color: #f87171;
      text-align: center;
      margin-top: 12px;
      font-weight: 500;
    }

    /* 主面板 */
    .dashboard {
      display: none;
      flex-direction: column;
      gap: 25px;
    }

    .dashboard.active {
      display: flex;
    }

    .dual-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .user-panel {
      flex: 1 1 280px;
      background: rgba(12, 16, 32, 0.8);
      backdrop-filter: blur(25px);
      border-radius: 40px;
      padding: 22px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: 0.3s;
    }

    .hh-panel {
      border-top: 3px solid #c084fc;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
    }

    .kk-panel {
      border-top: 3px solid #3b82f6;
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.25);
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .user-icon {
      font-size: 2.3rem;
    }

    .user-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .hh-panel .user-name {
      color: #d8b4fe;
    }

    .kk-panel .user-name {
      color: #93c5fd;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #a5b4fc;
      margin: 18px 0 12px;
      border-left: 4px solid;
      padding-left: 12px;
    }

    .hh-panel .section-title {
      border-color: #c084fc;
    }

    .kk-panel .section-title {
      border-color: #3b82f6;
    }

    .gender-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .gender-btn {
      flex: 1;
      background: rgba(20, 30, 50, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ccc;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .gender-btn:not(.disabled):hover {
      border-color: #fff;
      background: rgba(80, 60, 120, 0.6);
    }

    .gender-btn.selected-male {
      background: #4f46e5;
      border-color: #818cf8;
      color: white;
      box-shadow: 0 0 20px #6366f1;
    }

    .gender-btn.selected-female {
      background: #be185d;
      border-color: #f472b6;
      color: white;
      box-shadow: 0 0 20px #ec4899;
    }

    .gender-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .color-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: 0.25s;
      box-shadow: 0 0 12px currentColor;
      transform: scale(1);
    }

    .color-circle:hover {
      transform: scale(1.15);
      border-color: white;
      box-shadow: 0 0 25px currentColor;
    }

    .color-circle.selected-color {
      border: 3px solid white;
      box-shadow: 0 0 30px white;
      transform: scale(1.1);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }

    .answer-input {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .answer-submit {
      padding: 10px 18px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .answer-submit:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .answer-display {
      min-height: 30px;
      color: #cbd5e1;
      font-style: italic;
      padding: 6px 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
    }

    .lock-notice {
      font-size: 0.8rem;
      color: #fbbf24;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .login-title {
        font-size: 2rem;
      }
      .dual-panel {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="particles"></div>
  <div class="grid-bg"></div>
  <div class="scan-line"></div>

  <div class="main-wrapper" id="app">
    <!-- 登录界面 -->
    <div class="login-container" id="loginScreen">
      <div class="login-title">✨涵涵根坤坤的空间✨</div>
      <div class="login-dual">
        <div class="login-box hh-box">
          <div class="login-avatar">🐱</div>
          <div class="login-name">HH</div>
          <input type="password" class="password-input" id="hhPassword" placeholder="密码" maxlength="20">
        </div>
        <div class="login-box kk-box">
          <div class="login-avatar">🐶</div>
          <div class="login-name">KK</div>
          <input type="password" class="password-input" id="kkPassword" placeholder="密码" maxlength="20">
        </div>
      </div>
      <button class="login-btn" id="loginButton">🔐 进入空间</button>
      <div class="error-msg" id="loginError"></div>
    </div>

    <!-- 主面板 (初始隐藏) -->
    <div class="dashboard" id="dashboard">
      <div style="text-align:center; font-size:2rem; font-weight:800; letter-spacing:4px; background:linear-gradient(135deg,#c084fc,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">⚡ 涵涵根坤坤 · 下注平台 ⚡</div>
      <div class="dual-panel">
        <!-- HH 面板 -->
        <div class="user-panel hh-panel" id="hhPanel">
          <div class="user-header">
            <span class="user-icon">🐱</span>
            <span class="user-name">HH · 涵涵</span>
          </div>
          <div class="section-title">🧬 性别选择</div>
          <div class="gender-btns" id="hhGenderBtns">
            <button class="gender-btn" data-gender="男" data-user="hh">♂ 男</button>
            <button class="gender-btn" data-gender="女" data-user="hh">♀ 女</button>
          </div>
          <div class="lock-notice" id="hhGenderLock"></div>

          <div class="section-title">🎨 颜色选择</div>
          <div class="color-palette" id="hhColorPalette"></div>
          <div style="color:#cbd5e1; margin-top:4px; font-size:0.9rem;" id="hhColorDisplay">未选择</div>

          <div class="section-title">💬 我的答案</div>
          <div class="answer-area">
            <input type="text" class="answer-input" id="hhAnswerInput" placeholder="写下你的答案...">
            <button class="answer-submit" id="hhAnswerSubmit">提交答案</button>
            <div class="answer-display" id="hhAnswerDisplay"></div>
          </div>
        </div>

        <!-- KK 面板 -->
        <div class="user-panel kk-panel" id="kkPanel">
          <div class="user-header">
            <span class="user-icon">🐶</span>
            <span class="user-name">KK · 坤坤</span>
          </div>
          <div class="section-title">🧬 性别选择</div>
          <div class="gender-btns" id="kkGenderBtns">
            <button class="gender-btn" data-gender="男" data-user="kk">♂ 男</button>
            <button class="gender-btn" data-gender="女" data-user="kk">♀ 女</button>
          </div>
          <div class="lock-notice" id="kkGenderLock"></div>

          <div class="section-title">🎨 颜色选择</div>
          <div class="color-palette" id="kkColorPalette"></div>
          <div style="color:#cbd5e1; margin-top:4px; font-size:0.9rem;" id="kkColorDisplay">未选择</div>

          <div class="section-title">💬 我的答案</div>
          <div class="answer-area">
            <input type="text" class="answer-input" id="kkAnswerInput" placeholder="写下你的答案...">
            <button class="answer-submit" id="kkAnswerSubmit">提交答案</button>
            <div class="answer-display" id="kkAnswerDisplay"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // --- 状态管理 ---
      const state = {
        hh: {
          gender: null,
          color: null,
          answer: ''
        },
        kk: {
          gender: null,
          color: null,
          answer: ''
        },
        genderLocked: false, // 全局性别锁定，一旦有人选择，另一人不可选
        genderFirstUser: null // 'hh' 或 'kk'
      };

      // UI元素
      const loginScreen = document.getElementById('loginScreen');
      const dashboard = document.getElementById('dashboard');
      const hhPassInput = document.getElementById('hhPassword');
      const kkPassInput = document.getElementById('kkPassword');
      const loginBtn = document.getElementById('loginButton');
      const loginError = document.getElementById('loginError');

      // 颜色列表 (种类多一点)
      const colors = [
        { name: '红', code: '#ef4444' },
        { name: '橙', code: '#f97316' },
        { name: '黄', code: '#eab308' },
        { name: '绿', code: '#22c55e' },
        { name: '青', code: '#06b6d4' },
        { name: '蓝', code: '#3b82f6' },
        { name: '紫', code: '#8b5cf6' },
        { name: '粉', code: '#ec4899' },
        { name: '白', code: '#f8fafc' },
        { name: '灰', code: '#6b7280' }
      ];

      // --- 登录逻辑 ---
      loginBtn.addEventListener('click', () => {
        const hhPass = hhPassInput.value.trim();
        const kkPass = kkPassInput.value.trim();
        
        if (hhPass !== '123' || kkPass !== '123') {
          loginError.textContent = '❌ HH 或 KK 密码错误！请核对（均为123）';
          return;
        }
        
        // 登录成功
        loginScreen.style.display = 'none';
        dashboard.classList.add('active');
        initDashboard();
      });

      // 初始化主面板
      function initDashboard() {
        renderColorPalettes();
        attachGenderEvents();
        attachColorEvents();
        attachAnswerEvents();
        updateGenderUI();
      }

      // 渲染颜色调色板
      function renderColorPalettes() {
        const hhPalette = document.getElementById('hhColorPalette');
        const kkPalette = document.getElementById('kkColorPalette');
        [hhPalette, kkPalette].forEach(p => p.innerHTML = '');
        
        colors.forEach(c => {
          const circle = document.createElement('div');
          circle.className = 'color-circle';
          circle.style.backgroundColor = c.code;
          circle.style.color = c.code;
          circle.dataset.colorName = c.name;
          circle.dataset.colorCode = c.code;
          // 克隆给两个面板
          const hhCircle = circle.cloneNode(true);
          hhCircle.dataset.user = 'hh';
          const kkCircle = circle.cloneNode(true);
          kkCircle.dataset.user = 'kk';
          
          hhPalette.appendChild(hhCircle);
          kkPalette.appendChild(kkCircle);
        });
      }

      // 性别选择事件
      function attachGenderEvents() {
        const allGenderBtns = document.querySelectorAll('.gender-btn');
        allGenderBtns.forEach(btn => {
          btn.addEventListener('click', function(e) {
            const user = this.dataset.user;
            const gender = this.dataset.gender;
            
            // 检查全局性别锁定
            if (state.genderLocked) {
              alert('⚠️ 已有用户选择了性别，无法再次选择！');
              return;
            }
            
            // 检查该用户是否已经选择过（防止自己重复选，但允许切换？按规则，一个账号选择后锁定全局，所以一旦某用户选了，锁定）
            if (user === 'hh' && state.hh.gender) {
              alert('你已经选择过性别了');
              return;
            }
            if (user === 'kk' && state.kk.gender) {
              alert('你已经选择过性别了');
              return;
            }
            
            // 执行选择
            if (user === 'hh') {
              state.hh.gender = gender;
            } else {
              state.kk.gender = gender;
            }
            
            // 锁定全局，记录首个用户
            state.genderLocked = true;
            state.genderFirstUser = user;
            
            updateGenderUI();
          });
        });
      }

      function updateGenderUI() {
        // HH性别按钮
        const hhBtns = document.querySelectorAll('#hhGenderBtns .gender-btn');
        const kkBtns = document.querySelectorAll('#kkGenderBtns .gender-btn');
        const hhLock = document.getElementById('hhGenderLock');
        const kkLock = document.getElementById('kkGenderLock');
        
        // 重置样式
        hhBtns.forEach(b => {
          b.classList.remove('selected-male', 'selected-female', 'disabled');
        });
        kkBtns.forEach(b => {
          b.classList.remove('selected-male', 'selected-female', 'disabled');
        });
        
        // 根据状态设置
        if (state.genderLocked) {
          // 锁定状态：未选中的用户按钮变灰
          if (state.genderFirstUser === 'hh') {
            // HH已选，KK按钮禁用
            kkBtns.forEach(b => b.classList.add('disabled'));
            kkLock.textContent = '🔒 HH 已选择性别';
            hhLock.textContent = '';
            // HH高亮
            hhBtns.forEach(b => {
              if (state.hh.gender === '男') b.classList.add('selected-male');
              if (state.hh.gender === '女') b.classList.add('selected-female');
            });
            // 同时HH面板边框增强紫色
            document.getElementById('hhPanel').style.boxShadow = '0 0 40px #a855f7';
          } else if (state.genderFirstUser === 'kk') {
            hhBtns.forEach(b => b.classList.add('disabled'));
            hhLock.textContent = '🔒 KK 已选择性别';
            kkLock.textContent = '';
            kkBtns.forEach(b => {
              if (state.kk.gender === '男') b.classList.add('selected-male');
              if (state.kk.gender === '女') b.classList.add('selected-female');
            });
            document.getElementById('kkPanel').style.boxShadow = '0 0 40px #3b82f6';
          }
        } else {
          hhLock.textContent = '';
          kkLock.textContent = '';
        }
      }

      // 颜色选择事件
      function attachColorEvents() {
        const allCircles = document.querySelectorAll('.color-circle');
        allCircles.forEach(circle => {
          circle.addEventListener('click', function() {
            const user = this.dataset.user;
            const colorName = this.dataset.colorName;
            const colorCode = this.dataset.colorCode;
            
            if (user === 'hh') {
              state.hh.color = { name: colorName, code: colorCode };
              document.getElementById('hhColorDisplay').textContent = `已选：${colorName}`;
              // 更新选中样式
              document.querySelectorAll('#hhColorPalette .color-circle').forEach(c => c.classList.remove('selected-color'));
              this.classList.add('selected-color');
            } else {
              state.kk.color = { name: colorName, code: colorCode };
              document.getElementById('kkColorDisplay').textContent = `已选：${colorName}`;
              document.querySelectorAll('#kkColorPalette .color-circle').forEach(c => c.classList.remove('selected-color'));
              this.classList.add('selected-color');
            }
          });
        });
      }

      // 答案提交事件
      function attachAnswerEvents() {
        document.getElementById('hhAnswerSubmit').addEventListener('click', () => {
          const input = document.getElementById('hhAnswerInput');
          state.hh.answer = input.value.trim();
          document.getElementById('hhAnswerDisplay').textContent = state.hh.answer ? `📝 ${state.hh.answer}` : '未提交答案';
        });
        document.getElementById('kkAnswerSubmit').addEventListener('click', () => {
          const input = document.getElementById('kkAnswerInput');
          state.kk.answer = input.value.trim();
          document.getElementById('kkAnswerDisplay').textContent = state.kk.answer ? `📝 ${state.kk.answer}` : '未提交答案';
        });
      }

      // 支持回车提交答案
      document.getElementById('hhAnswerInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('hhAnswerSubmit').click();
      });
      document.getElementById('kkAnswerInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('kkAnswerSubmit').click();
      });

    })();
  </script>
</body>
</html>
